<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knoxified Voice — Browser Test</title>
  <!-- SDK served locally — avoids CDN blocking on Nigerian networks -->
  <script src="/test/twilio.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #fff; }
    p.sub { font-size: 13px; color: #666; margin-bottom: 32px; }
    label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      padding: 12px 14px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #555; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .btn-connect { background: #2563eb; color: #fff; }
    .btn-connect:hover { background: #1d4ed8; }
    .btn-connect:disabled { background: #1e3a5f; color: #4a6fa5; cursor: not-allowed; }
    .btn-hangup { background: #dc2626; color: #fff; display: none; }
    .btn-hangup:hover { background: #b91c1c; }
    .status {
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      background: #111;
      border: 1px solid #222;
      min-height: 48px;
      line-height: 1.6;
    }
    .status.connecting { border-color: #854d0e; color: #fbbf24; }
    .status.connected  { border-color: #166534; color: #4ade80; }
    .status.error      { border-color: #7f1d1d; color: #f87171; }
    .status.idle       { color: #555; }
    .log {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: #888;
      max-height: 220px;
      overflow-y: auto;
      line-height: 1.8;
    }
    .indicator {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #374151;
      margin-right: 8px;
      vertical-align: middle;
    }
    .indicator.active { background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎙 Knoxified Voice Test</h1>
    <p class="sub">Browser-based call tester — no phone required</p>

    <label>Your User ID (UUID)</label>
    <input type="text" id="userId"
      placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      value="ad409f1e-7150-4ed1-a4d1-ab5d523ab265" />

    <label>Server URL</label>
    <input type="text" id="serverUrl"
      placeholder="https://abc123.ngrok-free.app"
      value="https://phrase-whiff-pelt.ngrok-free.dev" />

    <button class="btn btn-connect" id="btnConnect" onclick="startCall()">
      Connect Call
    </button>
    <button class="btn btn-hangup" id="btnHangup" onclick="endCall()">
      Hang Up
    </button>

    <div class="status idle" id="status">
      <span class="indicator" id="indicator"></span>
      Ready — click Connect Call to begin
    </div>

    <div class="log" id="log"></div>
  </div>

  <script>
    // ── Verify SDK loaded ──────────────────────────────────
    window.addEventListener('load', () => {
      if (typeof Twilio === 'undefined' || !Twilio.Device) {
        document.getElementById('status').className = 'status error';
        document.getElementById('status').innerHTML =
          '<span class="indicator"></span>Twilio SDK failed to load. Check console for details.';
        console.error('Twilio SDK not loaded. Make sure twilio.min.js is in your public folder.');
      } else {
        console.log('Twilio SDK loaded ✓ — Device available:', typeof Twilio.Device);
      }
    });

    let device = null;
    let activeCall = null;

    function log(msg) {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
      console.log('[Knoxified]', msg);
    }

    function setStatus(msg, type = 'idle') {
      const el = document.getElementById('status');
      el.className = `status ${type}`;
      el.innerHTML = `<span class="indicator ${type === 'connected' ? 'active' : ''}" id="indicator"></span>${msg}`;
    }

    async function startCall() {
      const userId = document.getElementById('userId').value.trim();
      const serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');

      if (!userId || !serverUrl) {
        setStatus('Please enter your User ID and Server URL', 'error');
        return;
      }

      if (typeof Twilio === 'undefined') {
        setStatus('Twilio SDK not loaded — cannot connect', 'error');
        return;
      }

      document.getElementById('btnConnect').disabled = true;
      setStatus('Fetching access token...', 'connecting');
      log('Requesting token...');

      try {
        // Step 1: Get token from your server
        const tokenRes = await fetch(`${serverUrl}/token?userId=${userId}`);
        if (!tokenRes.ok) {
          const errData = await tokenRes.json().catch(() => ({}));
          throw new Error(errData.error || `Token request failed: ${tokenRes.status}`);
        }
        const { token } = await tokenRes.json();
        log('Token received ✓');

        // Step 2: Create Twilio Device — v2 API
        setStatus('Initialising device...', 'connecting');
        if (device) { device.destroy(); device = null; }

        device = new Twilio.Device(token, {
          logLevel: 1,
          codecPreferences: ['opus', 'pcmu']
        });

        device.on('error', (twilioError) => {
          log(`Device error [${twilioError.code}]: ${twilioError.message}`);
          setStatus(`Error: ${twilioError.message}`, 'error');
          resetUI();
        });

        // Step 3: Register device — required before connect in v2
        log('Registering device...');
        setStatus('Registering...', 'connecting');
        await device.register();
        log('Device registered ✓');

        // Step 4: Connect — async in v2, params go to /voice/browser
        setStatus('Connecting call...', 'connecting');
        activeCall = await device.connect({
          params: {
            userId: userId,
            mode: 'browser-test'
          }
        });

        log('Call initiated ✓');

        // Step 5: Call events
        activeCall.on('accept', () => {
          log('Call accepted ✓ — speak now');
          setStatus('Call active — speak now', 'connected');
          document.getElementById('btnHangup').style.display = 'block';
        });

        activeCall.on('disconnect', () => {
          log('Call disconnected');
          setStatus('Call ended', 'idle');
          resetUI();
        });

        activeCall.on('cancel', () => {
          log('Call cancelled');
          setStatus('Cancelled', 'idle');
          resetUI();
        });

        activeCall.on('error', (err) => {
          log(`Call error: ${err.message}`);
          setStatus(`Call error: ${err.message}`, 'error');
          resetUI();
        });

      } catch (err) {
        log(`Failed: ${err.message}`);
        setStatus(`Failed: ${err.message}`, 'error');
        resetUI();
      }
    }

    function endCall() {
      if (activeCall) { activeCall.disconnect(); activeCall = null; }
      if (device) { device.unregister(); device.destroy(); device = null; }
      log('Hung up');
      setStatus('Call ended', 'idle');
      resetUI();
    }

    function resetUI() {
      document.getElementById('btnConnect').disabled = false;
      document.getElementById('btnHangup').style.display = 'none';
    }
  </script>
</body>
</html>
